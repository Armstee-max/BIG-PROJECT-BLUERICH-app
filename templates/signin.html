<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | BLUERICH</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/bluerich logo.png') }}"
    />
    <link
      rel="apple-touch-icon"
      href="{{ url_for('static', filename='images/bluerich logo.png') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body data-page="signin">
    <div id="loader">
      <div>
        <h1>BLUERICH</h1>
        <div class="bar"></div>
        <p>Powered by</p>
        <img
          src="{{ url_for('static', filename='images/dgw_logo.png') }}"
          alt=""
          onerror="this.style.opacity = 0"
        />
      </div>
    </div>
    <div class="auth">
      <section class="panel">
        <div class="logo-box">
          <img
            src="{{ url_for('static', filename='images/bluerich logo.png') }}"
            alt="Company logo"
            onerror="this.style.opacity = 0"
          /><span>BLUERICH<small>Sales &amp; Operations</small></span>
        </div>
        <h3>Sign in</h3>
        <form>
          <label>Email<input name="email" type="email" required /></label
          ><label
            >Password<input name="password" type="password" required /></label
          ><button class="btn">Sign in</button>
        </form>
        <p class="muted">
          No account? <a href="{{ url_for('sign_up') }}">Sign Up</a>
        </p>
      </section>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
