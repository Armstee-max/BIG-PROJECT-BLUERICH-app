<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manager | BLUERICH</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/bluerich logo.png') }}" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/bluerich logo.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body data-page="app" data-role="manager">
    <div id="loader">
      <div>
        <h1>BLUERICH</h1>
        <div class="bar"></div>
        <p>Powered by</p>
        <img
          src="{{ url_for('static', filename='images/dgw_logo.png') }}"
          alt=""
          onerror="this.style.opacity = 0"
        />
      </div>
    </div>
    <div class="scrim" id="scrim"></div>
    <section class="sidebar">
      <div class="side-top">
        <div class="logo-box">
          <img
            src="{{ url_for('static', filename='images/bluerich logo.png') }}"
            alt="Company logo"
            onerror="this.style.opacity = 0"
          /><span>BLUERICH<small>Sales &amp; Operations</small></span>
        </div>
        <button class="bell" id="bell" aria-label="Notifications">
          <span id="bi"></span><b class="dot" id="dot" hidden></b>
        </button>
      </div>
      <p class="portal" id="portal"></p>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <p class="mail" id="mail"></p>
        <div class="foot-row">
          <a href="#profile" id="prof"></a
          ><button
            class="icon-btn"
            id="theme"
            aria-label="Switch between light and dark theme"
          ></button>
        </div>
        <button class="out-btn" id="logout"></button>
      </div>
    </section>
    <main class="main">
      <header class="topbar">
        <button
          class="menu-btn"
          id="menu"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <span></span><span></span><span></span>
        </button>
        <div class="ttl">
          <h1 id="title"></h1>
          <p class="sub" id="sub"></p>
        </div>
        <span class="role" id="who"></span>
      </header>
      <div id="view"></div>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
